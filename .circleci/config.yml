    steps:
      - attach_workspace:
          at: /ws/
      - run:
          name: Build Debian package
          command: cd build && make install && make package
      - store_artifacts:
          path: build/packages/
      - run:
          name: Start storing ccache
          command: date +%d-%m-%Y > /tmp/date
      - save_cache:
          key: ccache-{{ checksum "/tmp/date" }}
          paths:
            - /ws/ccache

# =================================================================
# Workflows - Orchestration of the build pipeline
# =================================================================

workflows:
  version: 2
  opencog-ecosystem-build:
    jobs:
      # Foundation Layer
      - cogutil
      
      # Core Layer - AtomSpace and Extensions
      - atomspace:
          requires:
            - cogutil
      - atomspace-rocks:
          requires:
            - atomspace
      - atomspace-restful:
          requires:
            - atomspace
      - atomspace-cog:
          requires:
            - atomspace
      - atomspace-dht:
          requires:
            - atomspace
      - atomspace-ipfs:
          requires:
            - atomspace
      - atomspace-websockets:
          requires:
            - atomspace
      - atomspace-metta:
          requires:
            - atomspace
      - atomspace-bridge:
          requires:
            - atomspace
      - atomspace-agents:
          requires:
            - atomspace
      - atomspace-rpc:
          requires:
            - atomspace
      - atomspace-js:
          requires:
            - atomspace
      - atomspace-typescript:
          requires:
            - atomspace
      - atomspace-explorer:
          requires:
            - atomspace
      
      # Logic Layer
      - unify:
          requires:
            - atomspace
      - ure:
          requires:
            - atomspace
            - unify
      
      # Cognitive Systems Layer
      - cogserver:
          requires:
            - atomspace
      - attention:
          requires:
            - atomspace
            - cogserver
      - spacetime:
          requires:
            - atomspace
      
      # Advanced Systems Layer
      - pln:
          requires:
            - atomspace
            - ure
            - spacetime
      - miner:
          requires:
            - atomspace
            - ure
      
      # Learning Systems Layer
      - moses:
          requires:
            - cogutil
      - asmoses:
          requires:
            - atomspace
            - ure
      
      # Language Processing Layer
      - lg-atomese:
          requires:
            - atomspace
      - learn:
          requires:
            - atomspace
            - cogserver
      - language-learning:
          requires:
            - cogutil
      
      # Integration Layer
      - opencog:
          requires:
            - atomspace
            - cogserver
            - attention
            - ure
            - lg-atomese
      
      # Packaging
      - package:
          requires:
            - opencog
          filters:
            branches:
              only: master