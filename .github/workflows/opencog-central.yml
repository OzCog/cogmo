name: OpenCog Central Consolidated Build

# OpenCog Central Consolidated GitHub Actions Configuration
# This configuration orchestrates the build of all OpenCog components
# in proper dependency order for the entire ecosystem.

"on":
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  CCACHE_DIR: /ws/ccache
  MAKEFLAGS: -j2

jobs:
  # =================================================================
  # Foundation Layer - Core utilities
  # =================================================================
  
  cogutil:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    defaults:
      run:
        working-directory: /ws/cogutil
    steps:
      - name: Start restoring ccache
        run: date +%d-%m-%Y > /tmp/date
      
      - name: Restore ccache
        uses: actions/cache@v3
        with:
          path: /ws/ccache
          key: ccache-${{ hashFiles('/tmp/date') }}
          restore-keys: ccache-
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: cogutil
      
      - name: Set number of make jobs
        run: echo "export MAKEFLAGS=-j2" >> $GITHUB_ENV
      
      - name: CMake Configure
        run: mkdir build && cd build && cmake ..
      
      - name: Build
        run: cd build && make
      
      - name: Build tests
        run: cd build && make tests
      
      - name: Run tests
        run: cd build && make check ARGS="$MAKEFLAGS"
      
      - name: Install CogUtil
        run: cd build && make install && ldconfig
      
      - name: Print test log
        if: always()
        run: cat build/tests/Testing/Temporary/LastTest.log
      
      - name: Upload workspace artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cogutil-workspace
          path: |
            /ws/cogutil
            /ws/ccache
          retention-days: 1

  # =================================================================
  # Core Layer - AtomSpace and extensions
  # =================================================================
  
  atomspace:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    services:
      postgres:
        image: ${{ github.repository }}/postgres
        env:
          POSTGRES_USER: opencog_test
          POSTGRES_PASSWORD: cheese
          POSTGRES_DB: opencog_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: /ws/atomspace
    steps:
      - name: Download cogutil workspace
        uses: actions/download-artifact@v3
        with:
          name: cogutil-workspace
          path: /ws
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: atomspace
      
      - name: Restore GHC Cache
        uses: actions/cache@v3
        with:
          path: /root/.stack
          key: ghc-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ runner.arch }}
      
      - name: Restore Haskell Deps Cache
        uses: actions/cache@v3
        with:
          path: atomspace/opencog/haskell/.stack-work
          key: haskelldeps-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ hashFiles('atomspace/opencog/haskell/opencog-atomspace.cabal') }}-${{ runner.arch }}
      
      - name: Install CogUtil
        run: cd /ws/cogutil/build && make install && ldconfig
      
      - name: CMake Configure
        run: mkdir build && cd build && cmake ..
      
      - name: Build
        run: cd build && make -j2
      
      - name: Build tests
        run: cd build && make -j2 tests
      
      - name: Run tests
        run: cd build && make check
      
      - name: Install AtomSpace
        run: cd build && make install && ldconfig
      
      - name: Build examples
        run: cd build && make -j2 examples
      
      - name: Print test log
        if: always()
        run: cat build/tests/Testing/Temporary/LastTest.log
      
      - name: Save GHC Cache
        uses: actions/cache@v3
        with:
          path: /root/.stack
          key: ghc-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ runner.arch }}
      
      - name: Save Haskell Deps Cache
        uses: actions/cache@v3
        with:
          path: atomspace/opencog/haskell/.stack-work
          key: haskelldeps-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ hashFiles('atomspace/opencog/haskell/opencog-atomspace.cabal') }}-${{ runner.arch }}
      
      - name: Upload workspace artifacts
        uses: actions/upload-artifact@v3
        with:
          name: atomspace-workspace
          path: |
            /ws/atomspace
            /ws/ccache
          retention-days: 1

  atomspace-rocks:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    defaults:
      run:
        working-directory: /ws/atomspace-rocks
    steps:
      - name: Download atomspace workspace
        uses: actions/download-artifact@v3
        with:
          name: atomspace-workspace
          path: /ws
      
      - name: Install CogUtil
        run: cd /ws/cogutil/build && make -j2 install && ldconfig
      
      - name: Install AtomSpace
        run: cd /ws/atomspace/build && make -j2 install && ldconfig
      
      - name: Checkout AtomSpace-Rocks
        run: git clone --depth 1 https://github.com/${{ github.repository }}/atomspace-rocks .
      
      - name: CMake Configure
        run: mkdir build && cd build && cmake ..
      
      - name: Build
        run: cd build && make -j2
      
      - name: Build tests
        run: cd build && make -j2 tests
      
      - name: Run tests
        run: cd build && make check
      
      - name: Install AtomSpace-Rocks
        run: cd build && make -j2 install && ldconfig
      
      - name: Print test log
