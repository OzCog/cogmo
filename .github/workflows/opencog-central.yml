        run: cd build && make -j2
      
      - name: Install Learn
        run: cd build && make -j2 install && ldconfig
      
      - name: Upload workspace artifacts
        uses: actions/upload-artifact@v3
        with:
          name: learn-workspace
          path: /ws/learn
          retention-days: 1

  language-learning:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    defaults:
      run:
        working-directory: /ws/language-learning
    steps:
      - name: Download cogutil workspace
        uses: actions/download-artifact@v3
        with:
          name: cogutil-workspace
          path: /ws
      
      - name: Checkout Language Learning
        run: git clone --depth 1 https://github.com/${{ github.repository }}/language-learning .
      
      - name: Build Language Learning
        run: echo "Language learning build placeholder"
      
      - name: Upload workspace artifacts
        uses: actions/upload-artifact@v3
        with:
          name: language-learning-workspace
          path: /ws/language-learning
          retention-days: 1

  # =================================================================
  # Integration Layer - Main OpenCog
  # =================================================================
  
  opencog:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    defaults:
      run:
        working-directory: /ws/opencog
    steps:
      - name: Download required workspaces
        uses: actions/download-artifact@v3
        with:
          name: atomspace-workspace
          path: /ws
      
      - name: Download cogserver workspace
        uses: actions/download-artifact@v3
        with:
          name: cogserver-workspace
          path: /ws
      
      - name: Download attention workspace
        uses: actions/download-artifact@v3
        with:
          name: attention-workspace
          path: /ws
      
      - name: Download ure workspace
        uses: actions/download-artifact@v3
        with:
          name: ure-workspace
          path: /ws
      
      - name: Download lg-atomese workspace
        uses: actions/download-artifact@v3
        with:
          name: lg-atomese-workspace
          path: /ws
      
      - name: Restore GHC Cache
        uses: actions/cache@v3
        with:
          path: /root/.stack
          key: ghc-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ runner.arch }}
      
      - name: Restore Haskell Deps Cache
        uses: actions/cache@v3
        with:
          path: atomspace/opencog/haskell/.stack-work
          key: haskelldeps-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}-${{ hashFiles('atomspace/opencog/haskell/opencog-atomspace.cabal') }}-${{ runner.arch }}
      
      - name: Set number of make jobs
        run: echo "export MAKEFLAGS=-j2" >> $GITHUB_ENV
      
      - name: Install CogUtil
        run: cd /ws/cogutil/build && make install && ldconfig
      
      - name: Install AtomSpace
        run: cd /ws/atomspace/build && make install && ldconfig
      
      - name: Install CogServer
        run: cd /ws/cogserver/build && make install && ldconfig
      
      - name: Install Attention
        run: cd /ws/attention/build && make install && ldconfig
      
      - name: Install Unify
        run: cd /ws/unify/build && make install && ldconfig
      
      - name: Install URE
        run: cd /ws/ure/build && make install && ldconfig
      
      - name: Install Link Grammar Atomese
        run: cd /ws/lg-atomese/build && make install && ldconfig
      
      - name: Checkout OpenCog
        run: git clone --depth 1 https://github.com/${{ github.repository }}/opencog .
      
      - name: CMake Configure
        run: mkdir build && cd build && cmake ..
      
      - name: Build
        run: cd build && make
      
      - name: Build tests
        run: cd build && make tests
      
      - name: Run tests
        run: cd build && make check ARGS="$MAKEFLAGS"
      
      - name: Install OpenCog
        run: cd build && make install && ldconfig
      
      - name: Print test log
        if: always()
        run: cat build/tests/Testing/Temporary/LastTest.log
      
      - name: Upload workspace artifacts
        uses: actions/upload-artifact@v3
        with:
          name: opencog-workspace
          path: |
            /ws/opencog
            /ws/ccache
          retention-days: 1

  # =================================================================
  # Packaging and Deployment
  # =================================================================
  
  package:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}/opencog-deps
      options: --user root
    defaults:
      run:
        working-directory: /ws/cogutil
    needs: [opencog]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download opencog workspace
        uses: actions/download-artifact@v3
        with:
          name: opencog-workspace
          path: /ws
      
      - name: Build Debian package
        run: cd build && make install && make package
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v3
        with:
          name: debian-packages
          path: build/packages/
          retention-days: 30
      
      - name: Start storing ccache
        run: date +%d-%m-%Y > /tmp/date
      
      - name: Save ccache
        uses: actions/cache@v3
        with:
          key: ccache-${{ hashFiles('/tmp/date') }}
          path: /ws/ccache